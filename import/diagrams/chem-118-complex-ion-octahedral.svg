<circle cx="250" cy="90" r="16" fill="#a8dadc"/>
<text x="250" y="94" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" font-weight="normal" fill="#1a1a1a">H2O</text>
<line x1="250" y1="200" x2="250" y2="310" stroke="#333" stroke-width="1.5"/>
<circle cx="250" cy="310" r="16" fill="#a8dadc"/>
<text x="250" y="314" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" font-weight="normal" fill="#1a1a1a">H2O</text>
