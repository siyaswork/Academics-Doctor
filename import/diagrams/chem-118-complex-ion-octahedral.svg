<text x="180" y="274" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" font-weight="normal" fill="#1a1a1a">H2O</text>
<text x="250" y="370" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Six water ligands donate lone pairs to the central Cu2+ ion</text>
<text x="250" y="390" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">via dative (coordinate) covalent bonds - octahedral shape</text>
