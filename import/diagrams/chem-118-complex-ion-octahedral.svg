<circle cx="360" cy="200" r="16" fill="#a8dadc"/>
<text x="360" y="204" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" font-weight="normal" fill="#1a1a1a">H2O</text>
<line x1="250" y1="200" x2="140" y2="200" stroke="#333" stroke-width="1.5"/>
<circle cx="140" cy="200" r="16" fill="#a8dadc"/>
<text x="140" y="204" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" font-weight="normal" fill="#1a1a1a">H2O</text>
<line x1="250" y1="200" x2="320" y2="130" stroke="#333" stroke-width="1.5"/>
<circle cx="320" cy="130" r="16" fill="#a8dadc"/>
<text x="320" y="134" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" font-weight="normal" fill="#1a1a1a">H2O</text>
<line x1="250" y1="200" x2="180" y2="270" stroke="#333" stroke-width="1.5"/>
