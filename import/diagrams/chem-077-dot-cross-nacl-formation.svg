<svg viewBox="0 0 650 320" xmlns="http://www.w3.org/2000/svg">
<rect width="650" height="320" fill="#ffffff"/>
<text x="325" y="30" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Formation of Sodium Chloride: Electron Transfer</text>
<circle cx="130" cy="150" r="35" fill="none" stroke="#264653" stroke-width="2"/>
<text x="130" y="155" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Na</text>
<circle cx="175" cy="120" r="4" fill="#e63946"/>
<text x="190" y="90" font-family="Arial, sans-serif" font-size="9" text-anchor="start" font-weight="normal" fill="#1a1a1a">single outer electron</text>
<defs><marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker></defs>
<line x1="200" y1="130" x2="330" y2="150" stroke="#333" stroke-width="2" marker-end="url(#a1)"/>
<circle cx="420" cy="150" r="40" fill="none" stroke="#264653" stroke-width="2"/>
<text x="420" y="155" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Cl</text>
<circle cx="454" cy="150" r="4" fill="#457b9d"/>
<circle cx="441" cy="176" r="4" fill="#457b9d"/>
<circle cx="413" cy="183" r="4" fill="#457b9d"/>
<circle cx="390" cy="165" r="4" fill="#457b9d"/>
<circle cx="389" cy="136" r="4" fill="#457b9d"/>
<circle cx="411" cy="117" r="4" fill="#457b9d"/>
<circle cx="440" cy="122" r="4" fill="#457b9d"/>
<text x="420" y="60" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#1a1a1a">seven outer electrons (x) + incoming electron (dot)</text>
<text x="325" y="230" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Na loses 1 electron -> Na+ ; Cl gains 1 electron -> Cl-</text>
<text x="325" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Resulting ions are held together by strong electrostatic attraction (ionic bond)</text>
<circle cx="200" cy="290" r="22" fill="#f4a261"/>
<text x="200" y="295" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Na+</text>
<text x="280" y="295" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1a1a1a">+</text>
<circle cx="360" cy="290" r="26" fill="#2a9d8f"/>
<text x="360" y="295" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Cl-</text>
</svg>