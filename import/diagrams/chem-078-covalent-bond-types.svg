<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
<rect width="700" height="260" fill="#ffffff"/>
<text x="350" y="30" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Single, Double and Triple Covalent Bonds</text>
<circle cx="80" cy="140" r="28" fill="#e9c46a" stroke="#333"/>
<circle cx="160" cy="140" r="28" fill="#e9c46a" stroke="#333"/>
<text x="120" y="155" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#1a1a1a">-</text>
<text x="120" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">H2 (single bond)</text>
<circle cx="310" cy="140" r="28" fill="#e9c46a" stroke="#333"/>
<circle cx="390" cy="140" r="28" fill="#e9c46a" stroke="#333"/>
<text x="350" y="155" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#1a1a1a">=</text>
<text x="350" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">O2 (double bond)</text>
<circle cx="520" cy="140" r="28" fill="#e9c46a" stroke="#333"/>
<circle cx="600" cy="140" r="28" fill="#e9c46a" stroke="#333"/>
<text x="560" y="155" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#1a1a1a">≡</text>
<text x="560" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">N2 (triple bond)</text>
<text x="350" y="240" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">More shared electron pairs = shorter, stronger bond (triple &lt; double &lt; single bond length)</text>
</svg>