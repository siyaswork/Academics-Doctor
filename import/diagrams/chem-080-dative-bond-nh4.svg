<svg viewBox="0 0 650 300" xmlns="http://www.w3.org/2000/svg">
<rect width="650" height="300" fill="#ffffff"/>
<text x="325" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Formation of the Ammonium Ion (Dative Covalent Bond)</text>
<text x="150" y="100" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#1a1a1a">NH3</text>
<text x="150" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1a1a1a">(lone pair on N)</text>
<text x="280" y="90" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#1a1a1a">+</text>
<text x="330" y="100" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#1a1a1a">H+</text>
<defs><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker></defs>
<line x1="400" y1="110" x2="480" y2="150" stroke="#333" stroke-width="2" marker-end="url(#a2)"/>
<text x="500" y="190" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1a1a1a">NH4+</text>
<text x="500" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1a1a1a">(N donates both electrons</text>
<text x="500" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1a1a1a">of the dative bond to H+)</text>
<text x="325" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">All four N-H bonds in NH4+ become identical once formed</text>
</svg>