<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="260" fill="#ffffff"/>
<text x="400" y="30" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Development of the Periodic Table</text>
<line x1="60" y1="130" x2="740" y2="130" stroke="#333333" stroke-width="3"/>
<circle cx="60" cy="130" r="7" fill="#264653"/>
<text x="60" y="110" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">1817</text>
<text x="60" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Döbereiner</text>
<text x="60" y="171" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Triads</text>
<circle cx="250" cy="130" r="7" fill="#264653"/>
<text x="250" y="110" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">1864</text>
<text x="250" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Newlands'</text>
<text x="250" y="171" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Octaves</text>
<circle cx="440" cy="130" r="7" fill="#264653"/>
<text x="440" y="110" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">1869</text>
<text x="440" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Mendeleev's</text>
<text x="440" y="171" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Periodic Table</text>
<circle cx="610" cy="130" r="7" fill="#264653"/>
<text x="610" y="110" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">1913</text>
<text x="610" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Moseley:</text>
<text x="610" y="171" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Atomic Number Order</text>
<circle cx="740" cy="130" r="7" fill="#264653"/>
<text x="740" y="110" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Present</text>
<text x="740" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Modern</text>
<text x="740" y="171" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Periodic Table</text>
